# Experiment plan for diamonds_are_forever (CONFLICT STONE · DIAMOND NET).
# Seven deterministic analyses over frozen canonical datasets; no RNG.

conditions:
  - id: provenance_chain
    description: "conflict-diamond custody chain: 5 handoffs, mine->fence"
    primary_metric: "documented coverage (recorded / total handoffs)"
    expected: 0.6
  - id: smuggling_corridors
    description: "risk-weighted corridor network: 10 corridors, cargo value 5.0 M USD"
    primary_metric: "expected-cost reduction vs fewest-hops baseline"
    expected: 0.1614
    baseline: "fewest-hops BFS route (expected cost 11.15)"
    ablation: "single corridor chain -> reduction collapses to 0"
  - id: lot_forensics
    description: "weight/density audit of the DF-71 lot over 5 samples"
    primary_metric: "anomaly count + verdict"
    expected: "2 anomalies, flagrant"
    baseline: "fully-clean lot (0 anomalies)"
    ablation: "remove density probe -> only excessive-loss anomaly remains"
  - id: casino_network
    description: "Las Vegas money movement: 7 casinos, 9 transfers"
    primary_metric: "laundering closure (share of flow on money cycles)"
    expected: 0.7742
  - id: benford_ledger
    # The baseline/ablation rows below previously described a conforming
    # legitimate half that did not exist: the old 40 "natural" amounts were
    # near-uniform across leading digits and scored 19.38 on their own, i.e.
    # anomalous. The baseline is now Fibonacci-derived, so its conformance is
    # a theorem rather than an assertion, and both rows are enforced by
    # tests/test_benford_audit.py.
    description: "141-transaction casino ledger: 80 legitimate + 61 round laundered deposits"
    primary_metric: "chi-square statistic vs critical value 15.507"
    expected: "35.805 (anomalous)"
    baseline: "legitimate half alone (Fibonacci leading digits): 0.5258, conforms"
    ablation: "drop the round deposits -> 0.5258, conforms"
  - id: orbital_mirror
    description: "geostationary mirror over Las Vegas at 36,000 km, 3 targets"
    primary_metric: "visible-face count (2 of 3) + slant range per target"
    expected_visible: 2
  - id: beam_physics
    description: "beam delivery of a 40 m mirror at geostationary range"
    primary_metric: "minimum mirror diameter for 1 MW/m2"
    expected: 42.7
    baseline: "diffraction-limited spot + Beer-Lambert attenuation"

primary_metric: "deterministic reproduction of all result tokens with zero mocks"
figures:
  expected: 7
  output_dir: output/figures
manuscript_tokens:
  block: "manuscript/config.yaml + src/diamonds_are_forever/manuscript_variables.py"
  cross-ref_gate: "every {{TOKEN}} in manuscript/[0-9]*.md resolves"
