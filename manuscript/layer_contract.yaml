# Layer contract for diamonds_are_forever (CONFLICT STONE).
layers:
  - name: "pure_core"
    modules:
      - "src/diamonds_are_forever/provenance_chain.py"
      - "src/diamonds_are_forever/smuggling_routes.py"
      - "src/diamonds_are_forever/lot_forensics.py"
      - "src/diamonds_are_forever/casino_network.py"
      - "src/diamonds_are_forever/benford_audit.py"
      - "src/diamonds_are_forever/orbital_mirror.py"
      - "src/diamonds_are_forever/beam_physics.py"
    imports_allowed:
      - "stdlib"
      - "orbital_mirror.SOLAR_CONSTANT_W_M2 (from beam_physics only)"
    imports_forbidden:
      - "bond_api"
      - "infrastructure"
    note: "must stay importable standalone"
  - name: "adapter"
    modules:
      - "src/diamonds_are_forever/mission.py"
    imports_allowed:
      - "pure_core"
      - "bond_api"
    note: "sole importer of bond_api; implements frozen MissionProvider"
  - name: "manifest_figures"
    modules:
      - "src/diamonds_are_forever/manuscript_variables.py"
      - "src/diamonds_are_forever/figures.py"
    imports_allowed:
      - "pure_core"
      - "yaml"
      - "matplotlib"
    imports_forbidden:
      - "bond_api"
  - name: "scripts"
    modules:
      - "scripts/"
    imports_allowed:
      - "adapter"
      - "pure_core"
      - "bond_api"
    note: "thin orchestrators only"
