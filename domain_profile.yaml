# Advisory agentic-research controls for diamonds_are_forever (CONFLICT STONE).
# Declarative intent only — does not execute autonomous agents.

domain: "special-agent mission analysis: conflict-goods provenance, financial-network laundering, orbital targeting geometry"

review_gates:
  - gate: "pytest-coverage"
    min: 90
    command: "uv run pytest tests/ --cov=src --cov-fail-under=90"
  - gate: "ruff"
    command: "uv run ruff check src/ scripts/"
  - gate: "mypy"
    command: "uv run mypy src/ scripts/"
  - gate: "lineage"
    description: "no template[_]code_project lineage strings in tracked source"

source_policy:
  - "canonical datasets are self-contained in the pure domain core (frozen)"
  - "no live external data; all numbers deterministic and reproducible"

artifact_expectations:
  - output/figures/provenance_chain.png   # documented vs break points
  - output/figures/smuggling_route.png    # corridor expected costs + optimum route
  - output/figures/lot_forensics.png      # weight deltas vs cutting allowance
  - output/figures/casino_network.png     # money-movement graph
  - output/figures/benford_ledger.png     # observed vs Benford digits
  - output/figures/orbital_visibility.png # slant-range / visibility
  - output/figures/beam_physics.png       # irradiance vs mirror diameter
  - output/figures/cargo_sweep.png       # route reduction vs cargo value
  - output/data/manuscript_variables.json # resolved {{TOKEN}} map
  - output/manuscript/                    # hydrated sections

benchmark_rubric:
  - "real computation only, zero mocks"
  - "deterministic: fixed seed, no untracked RNG, no wall-clock in persisted artifacts"
