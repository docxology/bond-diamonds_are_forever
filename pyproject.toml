# Diamonds Are Forever — PROJECT BOND film package · mission codename CONFLICT STONE
# Pure domain core (provenance chain, casino network, orbital mirror) with a
# MissionProvider adapter over the frozen BOND-API protocol.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diamonds_are_forever"
version = "0.1.0"
license = {text = "MIT"}
description = "CONFLICT STONE — special-agent mission software: conflict-diamond provenance, Las Vegas casino money movement, orbital-mirror targeting geometry"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "bond-api",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

# bond-api is the frozen protocol dependency, consumed as a local path package.
[tool.uv.sources]
bond-api = { path = "../bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy config (the monorepo root has no mypy_path for this
# package's src/ layout). Stricter typing with explicit package bases.
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.uv]
# Standalone package in the BOND suite; not a workspace member.
